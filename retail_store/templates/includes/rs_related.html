<section class="rs-related">
	<h2 class="rs-related-h">{{ _("You may also like") }}</h2>
	<div class="rs-grid">
		{% for p in items %}
		<a class="rs-prod" href="{{ p.route }}">
			<span class="rs-prod-img">{% if p.image %}<img src="{{ p.image }}" alt="{{ p.title }}" loading="lazy">{% else %}<span class="rs-prod-abbr">{{ p.abbr }}</span>{% endif %}</span>
			<span class="rs-prod-title">{{ p.title }}</span>
			{% if p.price %}<span class="rs-prod-price">{{ p.price }}</span>{% endif %}
		</a>
		{% endfor %}
	</div>
</section>
